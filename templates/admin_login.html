<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Abi Admin — Giriş</title>
  <style>
    :root { color-scheme: dark; font: 16px system-ui, sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #0b1020; color: #eef2ff; }
    main { box-sizing: border-box; width: min(92vw, 390px); padding: 32px; border: 1px solid #29334d; border-radius: 16px; background: #131b2e; box-shadow: 0 24px 80px #0006; }
    h1 { margin: 0 0 8px; font-size: 1.5rem; } p { margin: 0 0 24px; color: #aab5cc; }
    label { display: block; margin-bottom: 8px; font-weight: 600; }
    input, button { box-sizing: border-box; width: 100%; padding: 12px 14px; border-radius: 9px; font: inherit; }
    input { border: 1px solid #394662; background: #0b1020; color: inherit; }
    button { margin-top: 14px; border: 0; background: #6578ed; color: white; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    #message { min-height: 1.4em; margin-top: 14px; color: #ff9b9b; }
  </style>
</head>
<body>
  <main>
    <h1>Admin panelə giriş</h1>
    <p>İdarəetmə panelini açmaq üçün admin şifrəsini daxil edin.</p>
    <form id="login-form">
      <label for="password">Şifrə</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button id="submit" type="submit">Daxil ol</button>
      <div id="message" role="alert" aria-live="polite"></div>
    </form>
  </main>
  <script>
    const form = document.getElementById('login-form');
    const button = document.getElementById('submit');
    const message = document.getElementById('message');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      button.disabled = true;
      message.textContent = '';
      try {
        const response = await fetch('/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'Accept': 'application/json' },
          body: new URLSearchParams(new FormData(form)),
          credentials: 'same-origin'
        });
        const result = await response.json();
        if (!response.ok || !result.success) throw new Error(result.error || 'Giriş alınmadı.');
        window.location.assign(result.redirect || '/admin');
      } catch (error) {
        message.textContent = error.message || 'Serverlə əlaqə qurmaq mümkün olmadı.';
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
