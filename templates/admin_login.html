<!DOCTYPE html>
<html lang="az" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abi Bot — Admin Girişi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: '#5865F2',
            brandDark: '#4752C4',
            darkBg: '#0f1117',
            cardBg: '#181b24',
            borderDark: '#262a36'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-darkBg text-gray-200 min-h-screen flex items-center justify-center p-4 antialiased selection:bg-brand selection:text-white">

  <div class="w-full max-w-md bg-cardBg border border-borderDark rounded-2xl shadow-2xl p-8 backdrop-blur">
    <div class="flex flex-col items-center mb-8">
      <div class="w-16 h-16 rounded-2xl bg-brand flex items-center justify-center shadow-lg shadow-brand/30 mb-4 ring-4 ring-brand/20">
        <svg class="w-9 h-9 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-white tracking-wide">Abi Bot Admin</h1>
      <p class="text-sm text-gray-400 mt-1">İdarəetmə Panelinə Giriş</p>
    </div>

    <form id="loginForm" class="space-y-6">
      <div>
        <label for="password" class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-2">Admin Şifrəsi</label>
        <div class="relative">
          <input
            type="password"
            id="password"
            name="password"
            required
            autocomplete="current-password"
            placeholder="••••••••••••"
            class="w-full px-4 py-3 bg-[#11131a] border border-borderDark rounded-xl text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent transition"
          />
        </div>
      </div>

      <div id="errorAlert" class="hidden p-3.5 rounded-xl bg-red-900/30 border border-red-700/50 text-red-300 text-sm flex items-start gap-2.5">
        <svg class="w-5 h-5 flex-shrink-0 mt-0.5 text-red-400" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
        </svg>
        <span id="errorMessage">Xəta baş verdi</span>
      </div>

      <button
        type="submit"
        id="submitBtn"
        class="w-full py-3.5 px-4 bg-brand hover:bg-brandDark active:scale-[0.99] text-white font-medium rounded-xl transition shadow-lg shadow-brand/25 flex items-center justify-center gap-2 cursor-pointer"
      >
        <span>Daxil Ol</span>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
        </svg>
      </button>
    </form>

    <div class="mt-8 text-center border-t border-borderDark/60 pt-4 text-xs text-gray-500">
      Abi Bot • Təhlükəsiz Discord Admin İdarəetmə Paneli
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const errorAlert = document.getElementById('errorAlert');
    const errorMessage = document.getElementById('errorMessage');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.innerHTML = `
        <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg> Yoxlanılır...`;

      const formData = new FormData(form);

      try {
        const res = await fetch('/admin/login', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();

        if (res.ok && data.success) {
          window.location.href = data.redirect || '/admin';
        } else {
          errorMessage.innerText = data.error || 'Giriş uğursuz oldu.';
          errorAlert.classList.remove('hidden');
          submitBtn.disabled = false;
          submitBtn.innerHTML = `<span>Daxil Ol</span><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>`;
        }
      } catch (err) {
        errorMessage.innerText = 'Şəbəkə xətası baş verdi.';
        errorAlert.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>Daxil Ol</span>`;
      }
    });
  </script>
</body>
</html>
